name: rewind-test

# Offline handler tests via `rewind test` — the saga runner executes each tenant's
# `_tests/*.mjs` against its handlers through the real engine, with NO cluster, NO
# network, and NO secrets. So unlike e2e.yml (which hits live prod and is a post-merge
# monitor), this is a real PER-PR GATE: deterministic, fast, and it runs on forked PRs.
#
# `rewind test` lives in the `rewind` CLI, which is built from the rove repo (public).
# We build it from a pinned commit and cache the binary by that SHA, so all but the
# first run after a bump is a cache hit. Bump ROVE_REF when a harness fix is needed.

on:
  pull_request:
    paths:
      - "admin/**"
      - "auth/**"
      - "agent-sample/**"
      - "registry/**"
      - ".github/workflows/rewind-test.yml"
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "auth/**"
      - "agent-sample/**"
      - "registry/**"
      - ".github/workflows/rewind-test.yml"
  workflow_dispatch: {}

concurrency:
  group: rewind-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The rove commit the `rewind` CLI is built from. The CLI carries the sim
  # engine, the `rewind:test` harness AND the embedded first-party @rewind/*
  # package sources, so this pin fixes all three — not just a harness version.
  # It must be at least as new as everything the suites and the committed
  # generated files rely on: the replay-prelude check below compares
  # `replay/_static/arena-prelude.js` against THIS commit's shim sources, and
  # the admin suites call platform.* verbs the engine has to provide. A stale
  # pin fails here for content that is in fact current, so move it forward
  # with any apps change that needs a newer rove (rove#813 tracks replacing
  # the pin).
  ROVE_REF: ad8e5e9c5c21817257b630d30f2fe421b18cbcd8
  ZIG_VERSION: 0.15.2

jobs:
  rewind-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out rewind-apps
        uses: actions/checkout@v4

      - name: Cache the rewind CLI (keyed by rove commit)
        id: cache-rewind
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rewind
          # ImageOS is part of the key because the cached artifact is a
          # NATIVE BINARY. Without it, a runner-image roll leaves a stale
          # binary being restored and executed on a host it was not built
          # for — and because a cache hit also skips "Install system
          # libraries", it runs somewhere its dependencies were never
          # installed. That is how a commit green on 2026-08-09 started
          # aborting in `arena_reactor_new` on 2026-08-11 with no code
          # change: re-running the identical main run reproduced it.
          key: rewind-cli-${{ env.ROVE_REF }}-zig${{ env.ZIG_VERSION }}-${{ env.ImageOS }}

      # Unconditional: the CLI build needs this only on a cache miss, but the
      # prelude freshness check below needs it every run. A shallow clone is
      # cheaper than a check that silently stops running whenever the cache
      # happens to hit.
      - name: Check out rove
        uses: actions/checkout@v4
        with:
          repository: anarchodev/rove
          ref: ${{ env.ROVE_REF }}
          path: rove

      # `replay/_static/arena-prelude.js` is GENERATED from rove's engine shim
      # sources. It does not update itself, and a stale one means the browser
      # replay engine runs older shim code than the worker — silently, which
      # is how it has slipped through twice (rove#456).
      #
      # This is the rewind-apps half: the committed prelude must match the
      # rove commit this repo pins. rove's own gate checks the other half —
      # that its shim sources still match the digest recorded there — so a
      # change is caught at its source too.
      - name: Check the generated replay prelude is fresh
        run: |
          python3 rove/scripts/ops/gen_replay_prelude.py --check --apps-dir .

      - name: Install Zig
        if: steps.cache-rewind.outputs.cache-hit != 'true'
        run: |
          # Direct download (the confirmed tarball name is zig-<arch>-<os>-<ver>);
          # avoids a setup action's version/naming resolution.
          mkdir -p "$HOME/zig"
          curl -sSL --retry 3 "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Install system libraries
        # The rewind CLI links libcurl (deploy HTTP) + liblmdb (kvexp) and their
        # companions. Only needed on a cache miss (fresh CLI build).
        if: steps.cache-rewind.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev liblmdb-dev libssl-dev zlib1g-dev

      - name: Build the rewind CLI
        if: steps.cache-rewind.outputs.cache-hit != 'true'
        working-directory: rove
        run: |
          zig build rewind
          mkdir -p "$HOME/.local/bin"
          install zig-out/bin/rewind "$HOME/.local/bin/rewind"

      # The admin browser bundle (`admin/_static/`) is not loaded by the handler
      # engine, so its checks run under node. Cheap, and no CLI needed.
      - name: Run the admin browser-bundle checks
        run: |
          node admin/_tests/_api_base.node.mjs
          node admin/_tests/_billing_view.node.mjs

      - name: Run the handler test suites
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fail=0
          for dir in admin auth agent-sample/agent registry; do
            echo "::group::rewind test ./$dir"
            rewind test "./$dir" || fail=1
            echo "::endgroup::"
          done
          exit $fail
